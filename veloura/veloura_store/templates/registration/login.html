{% extends "base.html" %}
{% block title %}Login — Veloura{% endblock %}
{% block content %}
<section class="auth-section"><div class="auth-card">
<p class="eyebrow">WELCOME BACK</p><h1>Sign in</h1>
<form method="post">{% csrf_token %}
{% if form.non_field_errors %}<div class="error">{{ form.non_field_errors }}</div>{% endif %}
<div class="field"><label>Username</label>{{ form.username }}</div>
<div class="field"><label>Password</label>{{ form.password }}</div>
<button class="btn btn-dark full">Sign in</button>
</form>
<p class="auth-switch">New to Veloura? <a href="{% url 'register' %}">Create an account</a></p>
</div></section>
{% endblock %}
